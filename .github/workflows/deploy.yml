name: Deploy
on:
  push:
    branches: ["main"]

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  STAGE: prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Verify workspace lint and types
        run: |
          pnpm lint
          pnpm check-types

      - name: Verify deployment HTTP client
        run: pnpm --filter @caulk.lol/infra test

      - name: Verify blog regressions
        run: pnpm --filter blog test

      - name: Install browser for chart regressions
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify chart tooltip visibility
        run: pnpm test:browser

      - name: Deploy
        timeout-minutes: 10
        run: pnpm --filter @caulk.lol/infra run deploy
        env:
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          ALCHEMY_PASSWORD: ${{ secrets.ALCHEMY_PASSWORD }}
          ALCHEMY_STATE_TOKEN: ${{ secrets.ALCHEMY_STATE_TOKEN }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: https://api.caulk.lol
          CORS_ORIGIN: https://caulk.lol,https://admin.caulk.lol
          ADMIN_BOOTSTRAP_TOKEN: ${{ secrets.ADMIN_BOOTSTRAP_TOKEN }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
