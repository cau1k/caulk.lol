packages:
  - apps/*
  - packages/*
  - workers/*

# Install current stable releases, including same-day releases, as pnpm 10 did.
minimumReleaseAge: 0

allowBuilds:
  "@swc/core": true
  esbuild: true
  msw: true
  sharp: true
  workerd: true

catalog:
  "@trpc/client": ^11.18.0
  "@trpc/server": ^11.18.0
  "@types/node": ^24.13.3
  "@types/react": ^19.2.18
  "@types/react-dom": ^19.2.7
  alchemy: 0.94.0
  # 1.7 requires a rehearsed account identity data migration before deployment.
  better-auth: ~1.6.30
  dotenv: ^17.4.2
  drizzle-orm: ^0.45.2
  evlog: ^2.28.1
  hono: ^4.13.7
  next-themes: ^0.4.6
  react: ^19.2.8
  react-dom: ^19.2.8
  # Twoslash requires the compiler API; tsdown's TS 7 declaration support is experimental.
  typescript: ~6.0.3
  wrangler: ^4.129.0
  zod: ^4.5.4

patchedDependencies:
  "@tanstack/start-plugin-core@1.171.39": patches/@tanstack__start-plugin-core@1.171.39.patch
  alchemy: patches/alchemy.patch

# Alchemy imports Undici at runtime but declares it only as a dev dependency.
# Keep its dispatcher compatible with Node 24's built-in fetch.
packageExtensions:
  alchemy@0.94.0:
    dependencies:
      undici: ^7.29.1

# Patch vulnerable transitive ranges until their upstream packages update.
overrides:
  "esbuild@<=0.24.2": ^0.28.2
  "nanoid@<3.3.18": ^3.3.18
  "nanoid@>=4.0.0 <5.1.16": ^5.1.16
  "lodash-es@<4.18.1": ^4.18.1
  "sharp@<0.35.0": ^0.35.4
  "undici@>=7.0.0 <7.29.0": ^7.29.1
